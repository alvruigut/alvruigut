<svg width="920" height="250" viewBox="0 0 920 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Skill progress bars</title>
  <desc id="desc">Progress bars for Python, Bash Linux, TypeScript, React Node and Active Directory.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#35ff9f"/>
      <stop offset="100%" stop-color="#00baff"/>
    </linearGradient>
    <filter id="glow" x="-8%" y="-70%" width="116%" height="240%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="920" height="250" rx="16" fill="#050807"/>
  <rect x="1" y="1" width="918" height="248" rx="15" stroke="#53ff9f" stroke-opacity=".24"/>
  <g font-family="Cascadia Mono, Fira Code, Consolas, monospace" font-size="17" font-weight="700">
    <text x="34" y="46" fill="#d9ffe9">Python</text>
    <rect x="225" y="29" width="610" height="16" rx="8" fill="#10231b"/>
    <rect x="225" y="29" width="537" height="16" rx="8" fill="url(#bar)" filter="url(#glow)"/>
    <text x="858" y="46" fill="#35ff9f">88%</text>

    <text x="34" y="88" fill="#d9ffe9">Bash / Linux</text>
    <rect x="225" y="71" width="610" height="16" rx="8" fill="#10231b"/>
    <rect x="225" y="71" width="512" height="16" rx="8" fill="url(#bar)" filter="url(#glow)"/>
    <text x="858" y="88" fill="#35ff9f">84%</text>

    <text x="34" y="130" fill="#d9ffe9">TypeScript</text>
    <rect x="225" y="113" width="610" height="16" rx="8" fill="#10231b"/>
    <rect x="225" y="113" width="476" height="16" rx="8" fill="url(#bar)" filter="url(#glow)"/>
    <text x="858" y="130" fill="#35ff9f">78%</text>

    <text x="34" y="172" fill="#d9ffe9">React / Node</text>
    <rect x="225" y="155" width="610" height="16" rx="8" fill="#10231b"/>
    <rect x="225" y="155" width="451" height="16" rx="8" fill="url(#bar)" filter="url(#glow)"/>
    <text x="858" y="172" fill="#35ff9f">74%</text>

    <text x="34" y="214" fill="#d9ffe9">Active Directory</text>
    <rect x="225" y="197" width="610" height="16" rx="8" fill="#10231b"/>
    <rect x="225" y="197" width="500" height="16" rx="8" fill="url(#bar)" filter="url(#glow)"/>
    <text x="858" y="214" fill="#35ff9f">82%</text>
  </g>
</svg>
