<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RuyzTz7 terminal banner</title>
  <desc id="desc">Cybersecurity portfolio banner with neon terminal aesthetic.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="78%">
      <stop offset="0%" stop-color="#35ff9f" stop-opacity=".26"/>
      <stop offset="48%" stop-color="#00baff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#050807" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1e18"/>
      <stop offset="45%" stop-color="#090d11"/>
      <stop offset="100%" stop-color="#0b1018"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#35ff9f" stop-opacity="0"/>
      <stop offset="50%" stop-color="#35ff9f"/>
      <stop offset="100%" stop-color="#00baff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" stroke="#53ff9f" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" rx="26" fill="#050807"/>
  <rect width="1200" height="380" rx="26" fill="url(#panel)"/>
  <rect width="1200" height="380" rx="26" fill="url(#glow)"/>
  <rect width="1200" height="380" rx="26" fill="url(#grid)"/>
  <path d="M0 314 H1200" stroke="url(#line)" stroke-width="4" filter="url(#softGlow)"/>
  <path d="M0 74 H1200" stroke="#ffffff" stroke-opacity=".06"/>

  <g transform="translate(54 46)">
    <rect x="0" y="0" width="732" height="268" rx="16" fill="#05080A" fill-opacity=".82" stroke="#53ff9f" stroke-opacity=".28"/>
    <rect x="0" y="0" width="732" height="42" rx="16" fill="#ffffff" fill-opacity=".06"/>
    <circle cx="25" cy="21" r="6" fill="#ff5f57"/>
    <circle cx="47" cy="21" r="6" fill="#ffbd2e"/>
    <circle cx="69" cy="21" r="6" fill="#28c840"/>
    <text x="610" y="26" fill="#d6ffe8" fill-opacity=".62" font-family="Cascadia Mono, Fira Code, Consolas, monospace" font-size="14">zsh /home</text>

    <text x="34" y="94" fill="#f1fff7" font-family="Cascadia Mono, Fira Code, Consolas, monospace" font-size="31" font-weight="700">RuyzTz7@Kali</text>
    <text x="260" y="94" fill="#00baff" font-family="Cascadia Mono, Fira Code, Consolas, monospace" font-size="31" font-weight="700">/home</text>
    <text x="356" y="94" fill="#35ff9f" font-family="Cascadia Mono, Fira Code, Consolas, monospace" font-size="31" font-weight="700">❯</text>
    <text x="395" y="94" fill="#d9ffe9" font-family="Cascadia Mono, Fira Code, Consolas, monospace" font-size="31" font-weight="700">whoami</text>
    <rect x="521" y="69" width="4" height="31" fill="#35ff9f" filter="url(#softGlow)"/>

    <text x="34" y="144" fill="#effff5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Álvaro Ruiz Gutiérrez</text>
    <text x="34" y="184" fill="#d9ffe9" fill-opacity=".86" font-family="Cascadia Mono, Fira Code, Consolas, monospace" font-size="20">Software Engineering | Pentester Junior</text>
    <text x="34" y="222" fill="#35ff9f" font-family="Cascadia Mono, Fira Code, Consolas, monospace" font-size="18">OSCP · OSCP+ · eCPPTv3 · eJPTv2</text>
  </g>

</svg>
